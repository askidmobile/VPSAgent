name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Стиль: fmt должен быть чистым (строго).
      - run: cargo fmt --all -- --check
      # Clippy: warnings НЕ считаем ошибками (в существующем коде есть
      # предупреждения — очистка в отдельной задаче). Только явные ошибки.
      - run: cargo clippy --all-targets --all-features
        env:
          RUSTFLAGS: ""
      # Сборка и тесты — обязательно должны проходить.
      - run: cargo build --all-targets
      - run: cargo test --all